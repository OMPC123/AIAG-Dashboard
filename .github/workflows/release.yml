# Push a tag like v0.2.0 to build installers for Windows, macOS and Linux.
# They are attached to a *draft* GitHub release; review it and click "Publish" when ready.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to commit SHAs: this job can write releases, so a moved tag must not change what runs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and upload
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No paid code-signing certificates: Windows SmartScreen / macOS Gatekeeper will warn on first launch (see README).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
