<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>AIAG Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div class="brand-text">
        <h1 data-i18n="appName">AIAG Dashboard</h1>
        <p class="sub" id="updated" data-i18n="loading">…</p>
      </div>
    </div>
    <div class="actions">
      <div class="seg" role="group" data-i18n-title="viewTitle">
        <button class="seg-btn" data-view="compact" data-i18n="viewCompact" aria-pressed="false"></button>
        <button class="seg-btn" data-view="full" data-i18n="viewFull" aria-pressed="true"></button>
      </div>
      <button class="btn icon" id="btn-refresh" data-i18n-title="refreshTitle" data-i18n-aria="refresh">↻</button>
      <button class="btn icon toggle" id="btn-pin" data-i18n-title="pinTitle" data-i18n-aria="pin" aria-pressed="false">📌</button>
      <button class="btn icon" id="btn-settings" data-i18n-title="settings" data-i18n-aria="settings">⚙</button>
    </div>
  </header>

  <main>
    <section class="tiles full-only" id="tiles"></section>
    <div id="errors"></div>
    <div id="empty"></div>
    <section id="compact" class="compact-only"></section>
    <section class="grid full-only" id="accounts"></section>
    <section class="charts full-only" id="daily-section">
      <article class="card wide">
        <header class="card-h"><h2 data-i18n="dailyTitle"></h2><div class="legend" id="daily-legend"></div></header>
        <div class="chart" id="daily-chart"></div>
        <details class="table-view"><summary data-i18n="tableView"></summary><div id="daily-table"></div></details>
      </article>
    </section>
  </main>

  <dialog id="settings">
    <form id="settings-form">
      <h2 data-i18n="sTitle"></h2>

      <fieldset>
        <legend data-i18n="sGeneral"></legend>
        <label class="row"><span data-i18n="sLanguage"></span><select name="language" id="lang-select"></select></label>
        <label class="row"><span data-i18n="sRefresh"></span><input type="number" min="3" max="600" name="refreshSeconds" /></label>
        <label class="row"><span data-i18n="sMachineName"></span><input type="text" name="machineName" /></label>
        <label class="row check"><input type="checkbox" name="closeToTray" /> <span data-i18n="sCloseToTray"></span></label>
      </fieldset>

      <fieldset>
        <legend data-i18n="sAccounts"></legend>

        <div class="acc-group">
          <label class="row check acc-head"><input type="checkbox" name="claudeEnabled" /> <b data-i18n="sAccClaude"></b></label>
          <ul class="acc-list" id="acc-claude"></ul>
          <p class="hint" data-i18n="sAccPlanNote"></p>
        </div>

        <div class="acc-group">
          <label class="row check acc-head"><input type="checkbox" name="agEnabled" /> <b data-i18n="sAccAg"></b></label>
          <ul class="acc-list" id="acc-ag"></ul>
          <label class="row check"><input type="checkbox" name="quotaProbe" /> <span data-i18n="sQuota"></span></label>
          <p class="hint" data-i18n="sQuotaHint"></p>
        </div>

        <p class="hint" id="acc-remote-note" data-i18n="sAccRemoteNote"></p>
        <details>
          <summary data-i18n="sAdvanced"></summary>
          <label class="col"><span data-i18n="sAgDirs"></span>
            <textarea name="agDataDirs" rows="2" id="ag-dirs"></textarea>
          </label>
        </details>
      </fieldset>

      <fieldset>
        <legend data-i18n="sMulti"></legend>
        <label class="row check"><input type="checkbox" name="shareEnabled" /> <span data-i18n="sShare"></span></label>
        <div id="share-box">
          <label class="row"><span data-i18n="sPort"></span><input type="number" min="1024" max="65535" name="sharePort" /></label>
          <p class="hint" id="share-status"></p>
          <label class="col"><span data-i18n="sCode"></span>
            <span class="inline"><input type="text" id="share-code" readonly class="mono" />
              <button type="button" class="btn" id="share-copy" data-i18n="sCopy"></button>
              <button type="button" class="btn" id="share-regen" data-i18n="sRegen"></button></span>
          </label>
          <p class="hint" data-i18n="sRegenHint"></p>
          <p class="hint" id="firewall-hint"></p>
        </div>
        <div class="col">
          <span data-i18n="sRemotes"></span>
          <ul class="remote-list" id="remote-list"></ul>
          <span class="inline"><input type="text" id="remote-input" class="mono" data-i18n-placeholder="sRemotePaste" />
            <button type="button" class="btn" id="remote-add" data-i18n="sRemoteAdd"></button></span>
          <p class="hint error" id="remote-error" hidden></p>
          <label class="row check"><input type="checkbox" name="lanDiscovery" /> <span data-i18n="sLanDiscovery"></span></label>
          <p class="hint" data-i18n="sRediscoverHint"></p>
        </div>
      </fieldset>

      <p class="hint" id="settings-file"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" id="settings-cancel" data-i18n="sCancel"></button>
        <button type="submit" class="btn primary" data-i18n="sSave"></button>
      </div>
    </form>
  </dialog>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="../i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
